циализация",note:"Опыт, практические навыки и направления развития",items:[{id:"ai",icon:"ai",title:"Управление строительством",description:"Организация полного комплекса СМР, координация команд до 200 человек и контроль реализации объектов."},{id:"automation",icon:"automation",title:"Искусственный интеллект",description:"Изучение нейросетей и применение ИИ для анализа информации и решения практических задач."},{id:"digital",icon:"digital",title:"Автоматизация и прототипы",description:"Эксперименты с цифровыми продуктами и автоматизацией процессов; проекты находятся в разработке."}]},portfolio:{index:"02",title:"Портфолио",note:"Строительные объекты и цифровые разработки",linkLabel:"Открыть проект",empty:{badge:"В подготовке",title:"Цифровые проекты в разработке",text:"Изучаю технологии и создаю прототипы. Завершённые цифровые продукты будут опубликованы после проверки и запуска."},projects:[]},about:{index:"03",title:"Обо мне",lead:"От мастера СМР до руководителя проектов — и дальше, к новым технологиям.",paragraphs:["Мой профессиональный путь начался в 2018 году с должности мастера строительно-монтажных работ. Затем я работал прорабом и начальником участка, а сегодня занимаюсь руководством строительными проектами. В моей практике — комплексная организация работ и управление коллективами численностью до 200 человек.","Я участвовал в новом строительстве трёх лабораторных корпусов и паркинга на 900 машино-мест, работал над детским хирургическим отделением с операционными блоками, капитальным ремонтом двух московских поликлиник и школы. Сейчас веду капитальный ремонт здания мирового суда и представительства города Челябинска.","Мне близок практический подход: начинаю разбираться в задаче, проверяю идеи на деле, анализирую ошибки и при необходимости начинаю заново. Ценю ответственность, самостоятельность, аналитическое и нестандартное мышление.","Мой интерес к искусственному интеллекту начался со знакомства с Gemini и постепенно перерос в изучение нейросетей, автоматизации и цифровой разработки. Сейчас экспериментирую с инструментами и создаю прототипы. Моя цель — развивать навыки и выпускать полезные продукты, которые решают реальные задачи людей."],facts:[{label:"В строительстве",value:"С 2018 года"},{label:"Управление",value:"Команды до 200 человек"},{label:"Опыт",value:"Новое строительство · Капитальный ремонт"},{label:"Развитие",value:"ИИ · Автоматизация · Цифровые продукты"}]},principles:{index:"04",title:"Принципы работы",note:"Четыре правила, на которых строится каждая задача",items:[{id:"value",icon:"value",title:"Ответственность",description:"Принимаю решения и отвечаю за результат своей работы."},{id:"simple",icon:"simple",title:"Практический подход",description:"Проверяю идеи в деле, учусь на ошибках и улучшаю решения."},{id:"stack",icon:"stack",title:"Постоянное развитие",description:"Осваиваю новые инструменты и расширяю технические навыки."},{id:"clarity",icon:"clarity",title:"Аналитическое мышление",description:"Разбираюсь в деталях и ищу нестандартные пути решения."}]},contact:{index:"05",sectionTitle:"Контакты",title:"Обсудим ваш проект?",text:"Расскажите об идее, задаче или задайте вопрос.",telegramUrl:"",email:"",telegramLabel:"Telegram",emailLabel:"Написать на почту",unavailable:"Контактные данные скоро появятся."},footer:{note:"Сайт-портфолио",toTop:"Наверх"}};function sm(c){var h,v,o="";if(typeof c=="string"||typeof c=="number")o+=c;else if(typeof c=="object")if(Array.isArray(c)){var A=c.length;for(h=0;h<A;h++)c[h]&&(v=sm(c[h]))&&(o&&(o+=" "),o+=v)}else for(v in c)c[v]&&(o&&(o+=" "),o+=v);return o}function ny(){for(var c,h,v=0,o="",A=arguments.length;v<A;v++)(c=arguments[v])&&(h=sm(c))&&(o&&(o+=" "),o+=h);return o}const uy=(c,h)=>{const v=new Array(c.length+h.length);for(let o=0;o<c.length;o++)v[o]=c[o];for(let o=0;o<h.length;o++)v[c.length+o]=h[o];return v},iy=(c,h)=>({classGroupId:c,validator:h}),om=(c=new Map,h=null,v)=>({nextPart:c,validators:h,classGroupId:v}),fi="-",nm=[],cy="arbitrary..",fy=c=>{const
